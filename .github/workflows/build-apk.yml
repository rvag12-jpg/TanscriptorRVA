name: Build TanscriptorRVA APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.1.0' }
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TanscriptorRVA-1.0.0-debug.apk
          sha256sum TanscriptorRVA-1.0.0-debug.apk > TanscriptorRVA-1.0.0-debug.apk.sha256
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TanscriptorRVA-build-diagnostics
          path: |
            gradle-build.log
            apk-badging.txt
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TanscriptorRVA-APK-1.0.0
          path: |
            TanscriptorRVA-1.0.0-debug.apk
            TanscriptorRVA-1.0.0-debug.apk.sha256
